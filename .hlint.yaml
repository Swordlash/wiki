# HLint's settings (toolchain/lint.sh runs it, `npm run lint`, and CI's
# format job). HLint is here for restrictions only: every built-in hint is
# off, so that it reports nothing but what the rules below forbid. Its
# style hints are a decision not taken. With the default group of hints
# disabled, they are not even worked out: the run takes about 40 seconds
# rather than three minutes.
- group: {name: default, enabled: false}
- ignore: {}
- error: {name: Avoid restricted function}

- functions:
  # A pause on the clock, in every source directory toolchain/lint.sh
  # reads: all those the .cabal files name but the wiki-server's and the
  # maker's own programs (the script lists them, with why).
  # A test waits on the program's signal or on a condition named for what
  # it waits for, never on a clock (AGENTS.md); a pause in a view is
  # H.delay, or H.delayCounted when a test waits for the work after it.
  # The modules below held a threadDelay when the rule was made
  # (2026-11-17): each may keep its own, and no other module may start.
  # Take a module off the list once its last threadDelay is gone.
  - name: threadDelay
    message: "No threadDelay here. In a test, wait on the program's signal (waitQuiet, settle, an answer the test holds) or on a condition named for what it waits for, never on the clock. In wiki-app/src, a pause in a view is H.delay, or H.delayCounted when a test waits for the work after it (AGENTS.md)."
    within:
      # The browser suite (wiki-app-browser-test): 24 uses.
      - Test.Browser.Editor
      - Test.Browser.Emoji
      - Test.Browser.Encrypted
      - Test.Browser.Folds
      - Test.Browser.Policy
      - Test.Browser.SlideEditor
      - Test.Browser.SlideRows
      # wiki-app-test: 5 uses.
      - Test.Backend.Http
      # wiki-server-test: 12 uses.
      - Test.Server.Api
      - Test.Server.Backups
      - Test.Server.Comments
      - Test.Server.Export
      - Test.Server.Hygiene
      - Test.Server.Notifications
      # wiki-app/src: 7 uses, none a view's pause: the prerender's checks
      # that its HTML has settled, an object URL let go a minute after a
      # download, the live channel's back-off before it asks again, and a
      # transport that never answers.
      - Wiki.App.Static
      - Wiki.App.Browser
      - Wiki.App.Live
      - Wiki.App.Backend.Http.Transport
